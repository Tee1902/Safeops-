# Ghép với -f docker-compose.prod.yml sau khi có source ../frontend.
services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../backend/deploy/Dockerfile.nextjs
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    networks: [api]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend: { condition: service_healthy }
  caddy:
    volumes:
      - ./deploy/Caddyfile.frontend:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend: { condition: service_started }
