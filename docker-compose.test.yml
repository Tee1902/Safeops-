services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safeops_test
      POSTGRES_PASSWORD: safeops_test_only
      POSTGRES_DB: safeops_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeops_test -d safeops_test"]
      interval: 2s
      timeout: 5s
      retries: 30
