services:
  postgres:
    image: postgres:17-alpine
    container_name: safeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
    ports: ['127.0.0.1:5050:80']
    volumes: [pgadmin_data:/var/lib/pgadmin]
    depends_on:
      postgres: { condition: service_healthy }
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  postgres_data:
  pgadmin_data:
